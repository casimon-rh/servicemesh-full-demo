---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: servicemesh-full
  namespace: openshift-gitops
spec:
  destination:
    namespace: servicemesh
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    path: sm-component-argoapps
    repoURL: 'https://github.com/casimon-rh/servicemesh-full-demo'
    targetRevision: servicemesh3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2