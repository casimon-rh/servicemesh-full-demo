---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: servicemesh-full-node-a
  namespace: default
spec:
  destination:
    namespace: observability
    server: 'https://kubernetes.default.svc'
  project: default
  source:
    helm:
      valuesObject:
        env:
          - name: JUMPS
            value: '2'
          - name: ID
            value: A
          - name: CHAIN_SVC
            value: 'http://servicemesh-full-node-b:3000/chain'
          - name: ENABLE_METRICS
            value: false
          - name: ENABLE_TRACING
            value: false
        fullnameOverride: servicemesh-full-node-a
        image:
          name: quay.io/casimon/servicemesh-full-node
          pullPolicy: Always
          tag: otel
          local: false
          pullSecret: casimon-robot-pull-secret
        extraAnnotations:
          app.openshift.io/connects-to: '[{"apiVersion":"apps/v1","kind":"Deployment","name":"servicemesh-full-node-b"}]'
        nameOverride: ''
        replicaCount: 1
        route:
          enable: true
          wildcardDomain: ""
        service:
          port: 3000
          type: ClusterIP
        servicemesh:
          enable: false
        extraLabels:
          - app.kubernetes.io/part-of: servicemesh-node
          - app.openshift.io/runtime: nodejs
    path: sm-component-chart
    repoURL: 'https://github.com/casimon-rh/servicemesh-full-demo'
    targetRevision: opentelemetry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s
      limit: 2
